<!doctype html>
<html lang="ja">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ART QUEST ～秘密の鍵を探して～</title>
<style>
:root{
  --gold:#F5C542; --gold-deep:#C99A1E; --ink:#3A2A00;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","HGS明朝E",Georgia,serif;
  /* 入口の絵は 1122 × 1402 */
  --h:100dvh;
  --w:calc(var(--h) * 1122 / 1402);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#3A2414}
body{font-family:var(--mincho);color:#FFF8E8}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* パソコンなど横長の画面：絵のまわりは、同じ絵をぼかして敷きます */
#blur{position:fixed;inset:-40px;background:url(gate-blur.jpg) center/cover;filter:blur(24px) brightness(.8)}

/* 絵（高さいっぱい。スマホでは左右が少し切れます） */
#stage{position:fixed;top:0;left:50%;height:var(--h);width:var(--w);transform:translateX(-50%);
  transform-origin:51% 46%;transition:transform 1.4s cubic-bezier(.6,0,.3,1)}
#stage img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
/* ランタンの灯りをゆらす */
.lamp{position:absolute;width:13%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(255,206,120,.75),rgba(255,180,80,0));
  mix-blend-mode:screen;animation:flick 3.4s ease-in-out infinite;pointer-events:none}
@keyframes flick{0%,100%{opacity:.55}30%{opacity:.9}55%{opacity:.65}75%{opacity:1}}
/* 舞い落ちる葉 */
.leaf{position:absolute;top:-6%;width:2.2%;aspect-ratio:1.3;border-radius:0 80% 0 80%;opacity:.9;
  animation:fall linear infinite;pointer-events:none}
@keyframes fall{
  0%{transform:translate(0,0) rotate(0)}
  50%{transform:translate(6vh,55vh) rotate(200deg)}
  100%{transform:translate(-2vh,110vh) rotate(420deg)}}

/* 文字 */
#panel{position:fixed;left:0;right:0;bottom:0;z-index:5;text-align:center;
  padding:28vh 20px calc(26px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(40,20,6,0),rgba(40,20,6,.55) 38%,rgba(30,14,4,.86));
  transition:opacity .7s}
.eyebrow{font-size:clamp(11px,3vw,13px);letter-spacing:.5em;text-indent:.5em;color:#FFE2A8;opacity:.95}
h1{font-weight:400;font-size:clamp(34px,10vw,58px);letter-spacing:.14em;text-indent:.14em;line-height:1.2;margin:10px 0 4px;
  color:#FFF6DC;text-shadow:0 2px 6px rgba(60,25,0,.7),0 0 24px rgba(255,190,90,.55)}
.sub{font-size:clamp(14px,4vw,19px);letter-spacing:.24em;text-indent:.24em;color:#FFE9BC;
  text-shadow:0 1px 4px rgba(60,25,0,.8)}
.lead{margin:16px auto 0;max-width:30em;font-size:clamp(12px,3.4vw,14px);line-height:2;letter-spacing:.08em;color:#FFF1D6;
  text-shadow:0 1px 3px rgba(40,15,0,.9)}
.period{margin-top:10px;font-size:clamp(11px,3vw,12.5px);letter-spacing:.2em;color:#FFD98A}
#enter{margin-top:22px;padding:14px 46px;border-radius:999px;
  font-size:clamp(14px,4vw,16px);letter-spacing:.44em;text-indent:.44em;font-weight:bold;color:var(--ink);
  background:linear-gradient(180deg,#FCE6A0,var(--gold) 55%,var(--gold-deep));
  box-shadow:0 0 0 2px #FFF4C8,0 6px 20px rgba(0,0,0,.35),0 0 30px rgba(255,200,90,.55);
  animation:call 2.8s ease-in-out infinite}
#enter:hover{filter:brightness(1.08)}
@keyframes call{50%{box-shadow:0 0 0 2px #FFF4C8,0 6px 20px rgba(0,0,0,.35),0 0 46px rgba(255,210,110,.9)}}

/* ENTER：アーチの奥へ吸い込まれるように進んで、光の中へ */
#glow{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;transition:opacity .9s ease .5s;
  background:radial-gradient(circle at 50% 46%,#FFF8E2,#FFE6A8 45%,#F7C766)}
body.go #stage{transform:translateX(-50%) scale(2.6)}
body.go #panel{opacity:0}
body.go #glow{opacity:1}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="blur"></div>
<div id="stage"><img src="gate.jpg" alt="街の入口の門"></div>

<div id="panel">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <p class="lead" id="lead"></p>
  <div class="period" id="period"></div>
  <button id="enter">ENTER</button>
</div>
<div id="glow"></div>

<script>
/* ============================================================
   ★ ここだけ書き換えてください ★
   ============================================================ */
const GATE = {
  eyebrow: "アートの秋",
  title:   "ART QUEST",
  sub:     "～秘密の鍵を探して～",
  lead:    "18の部屋に、秘密の鍵が隠されています。\n街をめぐって鍵を集め、宝箱を開けよう。",
  period:  "2026.11.14 ― 11.30",
  map:     "map/"          // 地図の場所（このページからの位置）
};

/* ============================================================
   ここから下は触らなくて大丈夫です
   ============================================================ */
const $ = s => document.querySelector(s);
$('#eyebrow').textContent = GATE.eyebrow;
$('#title').textContent   = GATE.title;
$('#sub').textContent     = GATE.sub;
$('#lead').innerHTML      = GATE.lead.split('\n').map(t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('<br>');
$('#period').textContent  = GATE.period;
document.title = GATE.title + ' ' + GATE.sub;

/* ランタン（絵の中の位置） */
[[23.6,29.5],[74.3,29.5]].forEach(([x,y], i) => {
  const l = document.createElement('span');
  l.className = 'lamp';
  l.style.left = x + '%'; l.style.top = y + '%';
  l.style.animationDelay = (-i * 1.3) + 's';
  $('#stage').appendChild(l);
});
/* 舞い落ちる葉 */
const COLORS = ['#E8542A','#F08A2C','#F5B53A','#D9452A','#F7C948'];
for (let i = 0; i < 9; i++){
  const f = document.createElement('span');
  f.className = 'leaf';
  f.style.left = (5 + Math.random() * 85) + '%';
  f.style.background = COLORS[i % COLORS.length];
  f.style.animationDuration = (9 + Math.random() * 7) + 's';
  f.style.animationDelay = (-Math.random() * 14) + 's';
  f.style.scale = (0.7 + Math.random() * 0.7).toFixed(2);
  $('#stage').appendChild(f);
}

let going = false;
$('#enter').addEventListener('click', () => {
  if (going) return;
  going = true;
  document.body.classList.add('go');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => { location.href = GATE.map; }, reduce ? 50 : 1500);
});
/* 戻るボタンで入口に戻ってきたとき、もとの姿に戻す */
window.addEventListener('pageshow', e => {
  if (e.persisted){ going = false; document.body.classList.remove('go'); }
});
</script>
</body>
</html>
